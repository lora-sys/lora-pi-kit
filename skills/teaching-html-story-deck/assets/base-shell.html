<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{TITLE}}</title>
<style>
:root{--bg:#050505;--text:#f5f5f5;--muted:#999;--line:rgba(255,255,255,.1);--accent:#d8ff55;--spring:cubic-bezier(.16,1,.3,1)}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--text);font-family:Inter,system-ui,"PingFang SC",sans-serif}body{overflow:hidden}
.slide{position:absolute;inset:0;padding:48px;opacity:0;visibility:hidden;transform:translateY(20px);transition:.55s var(--spring)}.slide.active{opacity:1;visibility:visible;transform:none}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main id="deck">
  <section class="slide active" data-title="Hook"><h1>{{TITLE}}</h1></section>
</main>
<script>
const slides=[...document.querySelectorAll('.slide')];let current=0;
function show(i){current=(i+slides.length)%slides.length;slides.forEach((s,n)=>s.classList.toggle('active',n===current))}
document.addEventListener('keydown',e=>{if(['ArrowRight',' '].includes(e.key)){e.preventDefault();show(current+1)}if(e.key==='ArrowLeft'){e.preventDefault();show(current-1)}if(e.key.toLowerCase()==='f')document.documentElement.requestFullscreen?.()});
</script>
</body>
</html>
